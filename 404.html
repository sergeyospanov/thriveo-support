<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f8f9fa">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/png" href="assets/thriveo-icon.png">
  <link rel="stylesheet" href="styles.css">
  <title>Страница не найдена · Thriveo</title>
</head>
<body>
  <main class="error-page">
    <section class="error-panel">
      <picture>
        <source media="(prefers-color-scheme: dark)" srcset="assets/thriveo-logo-dark.png">
        <img src="assets/thriveo-logo-light.png" width="96" height="96" alt="">
      </picture>
      <h1>Страница не найдена.</h1>
      <p>Page not found. Вернитесь на официальную страницу поддержки Thriveo.</p>
      <div class="action-row">
        <a class="button" href="./">Открыть поддержку</a>
        <a class="button secondary" href="./?lang=en">Open support in English</a>
      </div>
    </section>
  </main>
</body>
</html>
